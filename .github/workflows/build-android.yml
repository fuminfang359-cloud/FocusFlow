name: Build FocusFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS platform projects
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          rm -rf /tmp/focusflow_scaffold
          flutter create \
            --project-name focusflow \
            --org com.focusflow \
            --platforms=android,ios \
            /tmp/focusflow_scaffold

          mkdir -p android ios lib
          cp -a /tmp/focusflow_scaffold/android/. android/
          cp -a /tmp/focusflow_scaffold/ios/. ios/
          cp ./*.dart lib/

          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="focusflow"/android:label="FocusFlow"/' \
              android/app/src/main/AndroidManifest.xml
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib

      - name: Analyze Dart source
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
